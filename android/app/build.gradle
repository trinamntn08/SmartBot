plugins {
    id 'com.android.application' version '8.13.0'
}

def podcastApi = providers.gradleProperty('smartbotPodcastApi')
        .orElse(providers.environmentVariable('SMARTBOT_PODCAST_API')).getOrElse('')
def youtubeApi = providers.gradleProperty('smartbotYoutubeApi')
        .orElse(providers.environmentVariable('SMARTBOT_YOUTUBE_API')).getOrElse('')

android {
    namespace 'io.github.trinamntn08.smartbot'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.trinamntn08.smartbot'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.3.4'
        buildConfigField 'String', 'PODCAST_API', groovy.json.JsonOutput.toJson(podcastApi)
        buildConfigField 'String', 'YOUTUBE_API', groovy.json.JsonOutput.toJson(youtubeApi)
    }

    buildFeatures { buildConfig = true }

    sourceSets {
        main.assets.srcDir(rootProject.file('../web'))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    // OkHttp 5.4 and later require a newer compile SDK.
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
}
