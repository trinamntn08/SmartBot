plugins {
    id 'com.android.application' version '8.13.0'
}

android {
    namespace 'io.github.trinamntn08.smartbot'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.trinamntn08.smartbot'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    sourceSets {
        main.assets.srcDir(rootProject.file('../web'))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
