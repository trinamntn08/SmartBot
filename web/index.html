<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal workspace for reading, learning, entertainment, and your daily routine.">
  <meta name="smartbot-podcast-service" content="">
  <title>SmartBot</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/smartbot-favicon-32.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/smartbot-favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/smartbot-touch-icon.png">
  <script src="./appearance.js"></script>
  <link rel="stylesheet" href="./appearance.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./book-reader.css">
  <link rel="stylesheet" href="./today.css">
  <link rel="stylesheet" href="./markets.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="shell header-inner">
      <a class="brand" href="#workspace">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <defs>
            <path id="smartbot-leaf" d="M43 39C34 42 24 39 17 32C12 27 10 19 11 13C11 11 12 10 14 10C24 10 34 14 40 22C44 27 46 33 45 37C45 38 44 39 43 39Z"/>
          </defs>
          <use class="brand-leaf-secondary" href="#smartbot-leaf"/>
          <use href="#smartbot-leaf" transform="rotate(90 50 50)"/>
          <use href="#smartbot-leaf" transform="rotate(180 50 50)"/>
          <use href="#smartbot-leaf" transform="rotate(270 50 50)"/>
        </svg>
        SmartBot
      </a>
      <nav class="header-nav" aria-label="Main" hidden>
        <a href="#books">Books</a>
        <a href="#news">News</a>
        <details class="nav-overflow">
          <summary aria-label="More sections">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <circle cx="5" cy="12" r="1.8"/>
              <circle cx="12" cy="12" r="1.8"/>
              <circle cx="19" cy="12" r="1.8"/>
            </svg>
          </summary>
          <div class="nav-overflow-links">
            <a href="#languages">Languages</a>
            <a href="#listen">Listen</a>
            <a href="#movies">Movies</a>
            <a href="#markets">Markets</a>
            <a href="#today">Today</a>
            <a href="#activities">Activities</a>
            <a href="#progress">Progress</a>
            <a href="#settings">Settings</a>
          </div>
        </details>
      </nav>
    </div>
  </header>
  <div class="shell">
    <section id="spotify-player" class="spotify-player" aria-label="Spotify player" tabindex="-1" hidden>
      <div class="embedded-player-toolbar">
        <a href="#tracks">Spotify playlist</a>
        <button type="button" class="quiet" aria-label="Close Spotify player" title="Close Spotify player">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
      <p class="spotify-offline" role="status" hidden>Connect to the internet to play this Spotify playlist.</p>
      <template>
        <iframe title="Spotify playlist player" width="100%" height="352"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </template>
    </section>
    <section id="youtube-player" class="youtube-player" aria-label="YouTube player" tabindex="-1" hidden>
      <div class="embedded-player-toolbar">
        <a href="#tracks" data-youtube-return>YouTube player</a>
        <button type="button" class="quiet" aria-label="Close YouTube player" title="Close YouTube player">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
      <div class="youtube-video"></div>
      <p class="youtube-search-status" role="status"></p>
      <a data-youtube-watch rel="noopener" hidden>Watch on YouTube</a>
    </section>
    <section id="podcast-player" class="card podcast-player" aria-label="Podcast player" hidden>
      <div class="podcast-player-episode">
        <span class="podcast-player-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 13v-1a8 8 0 0 1 16 0v1"/>
            <rect x="4" y="12" width="4" height="7" rx="2"/>
            <rect x="16" y="12" width="4" height="7" rx="2"/>
          </svg>
        </span>
        <div class="podcast-player-copy">
          <a class="podcast-player-title">
            <strong data-player-title></strong>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 6 6 6-6 6"/>
            </svg>
          </a>
          <span data-player-publisher></span>
        </div>
      </div>
      <div class="podcast-timeline">
        <span data-player-time aria-hidden="true">0:00</span>
        <input type="range" min="0" max="0" step="1" value="0" data-player-seek aria-label="Episode position" disabled>
        <span data-player-duration aria-hidden="true">–:––</span>
      </div>
      <div class="podcast-transport" role="group" aria-label="Playback controls">
        <button type="button" class="quiet podcast-skip" data-player-rewind aria-label="Back 10 seconds" title="Back 10 seconds">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>
            <text x="12" y="16">10</text>
          </svg>
        </button>
        <button type="button" data-player-toggle data-playback="play" aria-label="Play podcast">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
            <path data-icon="play" d="M8 5v14l11-7z"/>
            <path data-icon="pause" d="M7 5h4v14H7zm6 0h4v14h-4z"/>
            <path data-icon="retry" d="M20 6v6h-6m6 0a8 8 0 1 0-2.3 5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="quiet podcast-skip" data-player-forward aria-label="Forward 10 seconds" title="Forward 10 seconds">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M21 10a9 9 0 1 0-2 8m2-14v6h-6"/>
            <text x="12" y="16">10</text>
          </svg>
        </button>
      </div>
      <details class="podcast-speed">
        <summary aria-label="Playback speed, 1.0×" title="Playback speed, 1.0×"><span data-player-rate>1.0×</span></summary>
        <div class="podcast-speed-menu">
          <input type="range" min="0.25" max="4" step="0.01" value="1" aria-label="Playback speed" aria-valuetext="1×">
        </div>
      </details>
      <button type="button" class="quiet" data-player-dismiss aria-label="Close player" title="Close player">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
      <p class="podcast-player-status" role="status"></p>
    </section>
    <main id="view" tabindex="-1" aria-busy="true">Opening SmartBot…</main>
    <p id="error" role="alert" hidden></p>
    <noscript>Enable JavaScript to use SmartBot.</noscript>
  </div>
  <div class="ask-launcher-area">
    <button class="ask-launcher" type="button" aria-label="Ask SmartBot"
      aria-description="Drag or use the arrow keys to move."
      aria-haspopup="dialog" aria-controls="assistant" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 4h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-7l-5 3v-3.5A4 4 0 0 1 3 14V8a4 4 0 0 1 4-4Z"/>
        <path d="M8 9h8m-8 4h5"/>
      </svg>
    </button>
  </div>
  <dialog id="assistant" class="assistant" aria-label="Ask SmartBot">
    <div class="assistant-conversation" role="log" aria-label="Conversation" hidden></div>
    <form class="assistant-form">
      <textarea name="question" rows="1" maxlength="4000" aria-label="Your question" placeholder="Ask SmartBot…" enterkeyhint="send" autofocus></textarea>
      <button type="button" class="assistant-icon assistant-record" aria-label="Record voice" title="Record voice" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="record-start">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11v1a7 7 0 0 0 14 0v-1m-7 8v3"/>
          </g>
          <rect class="record-stop" x="7" y="7" width="10" height="10" rx="2"/>
        </svg>
      </button>
      <button type="submit" class="assistant-icon assistant-send" aria-label="Send question" title="Send question" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
      </button>
      <button type="button" class="assistant-icon assistant-close" aria-label="Close assistant" title="Close assistant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10m0-10L7 17"/></svg>
      </button>
      <p class="assistant-status" role="status"></p>
    </form>
  </dialog>
</body>
</html>
