<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Plan a short daily routine and keep track of your reading.">
  <title>SmartBot</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
          <path d="M4.5 18.5V8.5L12 5v10m0 0 7.5-3.5v7L12 22l-7.5-3.5L12 15Zm0-10 7.5 3.5" />
        </svg>
        <strong>SmartBot</strong>
      </div>
    </header>
    <div class="workspace">
      <main id="view" aria-busy="true"><p class="muted" role="status">Loading your routine…</p></main>
      <p id="error" role="alert" hidden></p>
      <noscript>Enable JavaScript to use SmartBot.</noscript>
    </div>
    <nav class="app-nav" aria-label="Main" hidden>
      <a href="#today">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="15" rx="2" />
          <path d="M7.5 3.5v4m9-4v4m-13 3h17m-11 5h5" />
        </svg>
        <span>Today</span>
      </a>
      <a href="#books">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
          <path d="M12 6.5C9.5 4.7 6 4.2 3.5 5.5v13c2.5-1.3 6-1.4 8.5.5 2.5-1.9 6-1.8 8.5-.5v-13c-2.5-1.3-6-.8-8.5 1v12" />
        </svg>
        <span>Books</span>
      </a>
      <a href="#activities">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
          <path d="M4 6.5h5m4 0h7M4 12h10m4 0h2M4 17.5h2m4 0h10M9 4v5m5 .5v5m-8 .5v5" />
        </svg>
        <span>Activities</span>
      </a>
      <a href="#progress">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
          <path d="M4 4v16h16m-12-4v-3m4 3V9m4 7V6m4 10V9" />
        </svg>
        <span>Progress</span>
      </a>
    </nav>
  </div>
</body>
</html>
