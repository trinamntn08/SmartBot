<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal workspace for reading, learning, entertainment, and your daily routine.">
  <meta name="smartbot-podcast-service" content="">
  <title>SmartBot</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./today.css">
  <link rel="stylesheet" href="./markets.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="shell header-inner">
      <a class="brand" href="#workspace"><span class="brand-mark" aria-hidden="true"></span>SmartBot</a>
      <nav class="header-nav" aria-label="Main" hidden>
        <a href="#books">Books</a>
        <a href="#news">News</a>
        <details class="nav-overflow">
          <summary aria-label="More sections">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <circle cx="5" cy="12" r="1.8"/>
              <circle cx="12" cy="12" r="1.8"/>
              <circle cx="19" cy="12" r="1.8"/>
            </svg>
          </summary>
          <div class="nav-overflow-links">
            <a href="#languages">Languages</a>
            <a href="#music">Music</a>
            <a href="#movies">Movies</a>
            <a href="#markets">Markets</a>
            <a href="#today">Today</a>
            <a href="#activities">Activities</a>
            <a href="#progress">Progress</a>
            <a href="#settings">Settings</a>
          </div>
        </details>
      </nav>
    </div>
  </header>
  <div class="shell">
    <section id="podcast-player" class="card podcast-player" aria-label="Podcast player" hidden>
      <strong></strong>
      <div class="actions">
        <button type="button" data-player-toggle data-playback="play" aria-label="Play podcast">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
            <path data-icon="play" d="M8 5v14l11-7z"/>
            <path data-icon="pause" d="M7 5h4v14H7zm6 0h4v14h-4z"/>
            <path data-icon="retry" d="M20 6v6h-6m6 0a8 8 0 1 0-2.3 5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="quiet" data-player-rewind aria-label="Back 15 seconds">−15 s</button>
      </div>
      <input type="range" min="0" max="0" step="1" value="0" aria-label="Episode position">
      <span data-player-time></span>
      <p role="status"></p>
    </section>
    <main id="view" aria-busy="true">Opening SmartBot…</main>
    <p id="error" role="alert" hidden></p>
    <noscript>Enable JavaScript to use SmartBot.</noscript>
  </div>
  <div class="ask-launcher-area">
    <button class="ask-launcher" type="button" aria-label="Ask SmartBot"
      aria-description="Drag or use the arrow keys to move."
      aria-haspopup="dialog" aria-controls="assistant" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 4h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-7l-5 3v-3.5A4 4 0 0 1 3 14V8a4 4 0 0 1 4-4Z"/>
        <path d="M8 9h8m-8 4h5"/>
      </svg>
    </button>
  </div>
  <dialog id="assistant" class="assistant" aria-label="Ask SmartBot">
    <div class="assistant-conversation" role="log" aria-label="Conversation" hidden></div>
    <form class="assistant-form">
      <textarea name="question" rows="1" maxlength="4000" aria-label="Your question" placeholder="Ask SmartBot…" enterkeyhint="send" autofocus></textarea>
      <button type="button" class="assistant-icon assistant-record" aria-label="Record voice" title="Record voice" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="record-start">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11v1a7 7 0 0 0 14 0v-1m-7 8v3"/>
          </g>
          <rect class="record-stop" x="7" y="7" width="10" height="10" rx="2"/>
        </svg>
      </button>
      <button type="submit" class="assistant-icon assistant-send" aria-label="Send question" title="Send question" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
      </button>
      <button type="button" class="assistant-icon assistant-close" aria-label="Close assistant" title="Close assistant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10m0-10L7 17"/></svg>
      </button>
      <p class="assistant-status" role="status"></p>
    </form>
  </dialog>
</body>
</html>
