<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan a short daily routine and keep track of your reading.">
  <title>SmartBot</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <strong>SmartBot</strong>
      <nav aria-label="Main" hidden>
        <a href="#today">Today</a>
        <a href="#books">Books</a>
        <a href="#activities">Activities</a>
        <a href="#progress">Progress</a>
      </nav>
    </header>
    <main id="view" aria-busy="true">Loading your routine…</main>
    <p id="error" role="alert" hidden></p>
    <noscript>Enable JavaScript to use SmartBot.</noscript>
  </div>
</body>
</html>
